<!DOCTYPE html>
<html>

<head>

<title>Upload Notes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">

<span class="navbar-brand fw-bold">Notenest</span>

<a href="/student" class="btn btn-light">Back</a>

</nav>

<div class="container mt-5">

<div class="card p-4 shadow">

<h3 class="mb-4">Upload Notes</h3>

<form method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">Subject</label>

<input type="text" name="subject" class="form-control" required>

</div>

<div class="mb-3">

<label class="form-label">Subject ID</label>

<input type="text" name="subject_id" class="form-control" required>

</div>

<div class="mb-3">

<label class="form-label">Your name</label>

<input type="text" name="student_name" class="form-control" required>

</div>

<div class="mb-3">

<label class="form-label">Unit</label>

<input type="text" name="unit" class="form-control">

</div>

<div class="mb-3">

<label class="form-label">Category</label>

<select name="category" class="form-control">

<option>Short Notes</option>
<option>Long Notes</option>
<option>Previous Year Papers</option>
<option>Textbook</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">Upload File</label>

<input type="file" name="file" class="form-control" required>

</div>

<button class="btn btn-primary">

Upload Notes

</button>

</form>

</div>

</div>

</body>

</html>
