<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Study Material</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark px-4">

<span class="navbar-brand fw-bold">Notenest</span>

<a href="/teacher" class="btn btn-light">Dashboard</a>

</nav>


<div class="container mt-5">

<div class="card p-4 shadow">

<h3 class="mb-4">Upload Study Material</h3>

<form action="/upload" method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">Subject</label>

<input type="text" name="subject" class="form-control" required>

</div>


<div class="mb-3">

<label class="form-label">Subject ID</label>

<input type="text" name="subject_id" class="form-control" required>

</div>


<div class="mb-3">

<label class="form-label">Teacher Name</label>

<input type="text" name="teacher_name" class="form-control" required>

</div>


<div class="mb-3">

<label class="form-label">Unit</label>

<input type="text" name="unit" class="form-control" placeholder="Example: Unit 3">

</div>


<div class="mb-3">

<label class="form-label">Category</label>

<select name="category" class="form-control">

<option>Short Notes</option>
<option>Long Notes</option>
<option>Previous Year Papers</option>
<option>Textbook</option>
<option>Model Questions</option>

</select>

</div>


<div class="mb-3">

<label class="form-label">Upload File</label>

<input type="file" name="file" class="form-control" accept=".pdf,.doc,.docx,.ppt,.pptx" required>

</div>


<div class="mb-3">

<label class="form-label">YouTube Lesson Link (Optional)</label>

<input type="text" name="youtube" class="form-control">

</div>


<button type="submit" class="btn btn-primary">

Upload Resource

</button>

</form>

</div>

</div>

</body>

</html>
